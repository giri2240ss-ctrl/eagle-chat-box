<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eagle AI</title>
<link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#000;--card:#0d0d12;--muted:#9a9aa5;--line:#2a2a33;--gold:#f5b82e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
.screen{display:none;height:100%;flex-direction:column;overflow-y:auto}.screen.on{display:flex}
button{font:inherit;cursor:pointer}
#s1{align-items:center;justify-content:center;padding:24px;text-align:center;background:#fff;color:#000}
#s1 .big{font-size:96px;line-height:1}#s1 img.logo{width:210px;height:auto;margin-bottom:8px}
.tl{height:26px;width:auto;filter:invert(1);vertical-align:middle;margin-right:6px}
#s1 h2{font-style:italic;font-weight:900;font-size:40px;margin:4px 0 0}#s1 small{letter-spacing:6px;font-size:11px}
#s1 h1{font-size:34px;margin:36px 0 4px}
.pill{width:100%;max-width:340px;border-radius:40px;padding:15px;font-weight:700;font-size:16px;margin-top:12px}
.dark{background:#000;color:#fff;border:2px solid #000}.light{background:#fff;color:#000;border:2px solid #000}
#s2{background:#fff;color:#000}
.hero{background:linear-gradient(90deg,#4aa0ff,#5a6bff,#0a44b8);color:#fff;font-size:34px;font-weight:800;padding:56px 28px 70px;border-radius:0 0 140px 0;width:80%}
form{padding:28px;display:flex;flex-direction:column;gap:20px}
.f{position:relative}.f label{position:absolute;top:-10px;left:18px;background:#fff;padding:0 8px;font-size:13px}
.f input{width:100%;padding:16px;border:2px solid #0a44b8;border-radius:16px;background:#e8eefc;font-size:16px;color:#000}
.err{color:#b3261e;font-size:14px;min-height:18px}
#s2 .link{background:none;border:0;text-decoration:underline;color:#000;font-size:15px}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px}.top .lg{font-weight:900;font-style:italic;font-size:20px}.top .sp{flex:1}
.pro{border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:5px 12px;font-size:13px;background:none}
.av{width:34px;height:34px;border:2px solid #fff;border-radius:50%;background:none;color:#fff}
.welcome{padding:6px 16px 4px;background:radial-gradient(circle at 90% 30%,#3a3a44,#000 60%)}
.welcome p{margin:0;font-size:15px}.welcome h1{font-size:28px;font-style:italic;margin:2px 0 6px}.welcome em{color:var(--muted)}
.ask{display:flex;align-items:center;border:1px solid #555;border-radius:30px;padding:6px 6px 6px 14px;margin:12px 0;color:var(--muted);width:92%;background:#000a;cursor:pointer}
.ask span{flex:1}.ask b{background:#888;color:#000;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.sec{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:13px;letter-spacing:1px}.sec i{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
.t{border-radius:14px;padding:10px 8px;min-height:128px;text-align:left;color:#fff;border:1px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#000),#000 80%)}
.t .ic{font-size:26px;display:block;margin-bottom:6px}.t b{font-size:12.5px;display:block}.t span{font-size:10px;color:#c5c5cc;display:block;margin-top:3px;line-height:1.3}
.quick{margin:12px;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;background:var(--card)}
.quick div:first-child{flex:1}.quick b{font-size:14px}.quick small{display:block;color:var(--muted);font-size:10px}
.q{text-align:center;font-size:10px;color:#ccc;background:none;border:0}.q span{display:block;font-size:20px}
.nav{margin-top:auto;position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;background:#000;border-top:1px solid var(--line);padding:6px 4px}
.nav button{background:none;border:0;color:var(--muted);font-size:11px}.nav button span{display:block;font-size:20px}.nav .on{color:#fff}
.mic{width:54px;height:54px;border-radius:50%;border:2px solid #fff!important;background:#000!important;font-size:22px!important}
.chead{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}.chead button{background:none;border:0;color:#fff;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.bot{align-self:flex-start;background:#1a1a22;border-bottom-left-radius:4px}.me{align-self:flex-end;background:var(--gold);color:#000;border-bottom-right-radius:4px}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.cin textarea{flex:1;resize:none;border:1px solid #444;background:#111;color:#fff;border-radius:20px;padding:10px 14px;font:inherit;font-size:15px}
.cin button{width:42px;height:42px;border-radius:50%;border:0;background:var(--gold);align-self:flex-end}
.menu{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}.menu.on{display:flex}
.mbox{width:100%;max-width:480px;background:#16161c;border-radius:20px 20px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mbox button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;font-size:16px;padding:15px 12px;border-radius:12px}
.mbox button:active{background:#2a2a33}.mbox .red{color:#ff6b6b}
#seltxt{-webkit-user-select:text;user-select:text;max-height:50vh;overflow-y:auto;padding:12px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word;background:#0d0d12;border-radius:12px;margin-bottom:8px}
.bot.md{white-space:normal}
.bot p{margin:0 0 6px}.bot .sp{height:4px}
.bot ul,.bot ol{margin:4px 0 8px;padding-left:22px}.bot li{margin:2px 0}
.bot h4{margin:10px 0 4px;font-size:16px}
.bot pre{background:#0b0b10;border:1px solid #2a2a33;border-radius:10px;padding:10px;overflow-x:auto;font-size:13px;margin:6px 0;white-space:pre}
.bot code{font-family:ui-monospace,Menlo,monospace;background:#0b0b10;padding:1px 5px;border-radius:5px;font-size:13px}
.bot pre code{background:none;padding:0}
.m.fly{white-space:normal;padding:12px 16px}
.ft{position:relative;width:150px;height:34px;overflow:hidden}
.ft .eg{position:absolute;top:3px;left:-40px;height:26px;width:auto;filter:invert(1);transform-origin:50% 60%;animation:flyx 2.2s linear infinite,flap .35s ease-in-out infinite alternate}
.ft i{position:absolute;right:-30px;height:2px;width:22px;border-radius:2px;background:#ffffff40;animation:wind 1s linear infinite}
@keyframes flyx{from{left:-40px}to{left:150px}}
@keyframes flap{from{transform:translateY(-3px) rotate(-8deg) scaleY(1)}to{transform:translateY(3px) rotate(6deg) scaleY(.8)}}
@keyframes wind{from{right:-30px;opacity:0}30%{opacity:1}to{right:160px;opacity:0}}
.at{background:#222!important;color:#fff;font-size:18px}
.pv{position:relative;flex:0 0 auto}.pv img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #444;display:block}
.pv b{position:absolute;top:-6px;right:-6px;background:#ff6b6b;color:#000;width:20px;height:20px;border-radius:50%;font-size:11px;display:grid;place-items:center}
.pv[data-v]::after,.th div[data-v]::after{content:"▶ video";position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px}
#prev{display:none;gap:10px;padding:10px 12px 2px;overflow-x:auto;border-top:1px solid var(--line)}#prev.on{display:flex}
.th{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.th div{position:relative}.th img{width:110px;height:110px;object-fit:cover;border-radius:12px;display:block}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<section class="screen on" id="s1">
  <img data-logo class="logo" alt="Eagle AI"><h2>EAGLE AI</h2><small>CHAT WITH YOU</small>
  <h1>Sign Up</h1><div>Continue with Mail</div>
  <button class="pill dark" onclick="openForm()">✉️ Continue with Mail</button>
  <button class="pill light" id="gbtn">G&nbsp; Continue with Google</button>
  <button class="pill light" onclick="guest()">Sign As Guest</button>
  <div class="err" id="err1" style="margin-top:12px"></div>
</section>

<section class="screen" id="s2">
  <div class="hero" id="htitle">SignUp</div>
  <form onsubmit="return false">
    <div class="f" id="nameF"><label>Name</label><input id="name" autocomplete="name"></div>
    <div class="f"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
    <div class="f"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
    <div class="err" id="err"></div>
    <button class="pill dark" id="submit" type="button" style="margin:0;max-width:none;border-radius:16px">SignUp</button>
    <div style="text-align:center"><span id="ask2">Already Registered?</span><br><button class="link" id="swap" type="button">Log in here</button><br><button class="link" type="button" onclick="show('s1')">← Back</button></div>
  </form>
</section>

<section class="screen" id="s3">
  <div class="top"><span style="font-size:22px">☰</span><span class="lg"><img data-logo class="tl" alt="">EAGLE AI</span><span class="sp"></span><button class="pro">👑 Pro</button><button class="av" onclick="logout()" title="Log out">👤</button></div>
  <div class="welcome">
    <p>Hey <span id="uname">there</span>! 👋</p><p>Welcome to</p><h1>EAGLE <em>AI</em></h1>
    <p style="font-size:12px;color:#ccc">Your Smart AI Assistant &amp; Creative Partner</p>
    <div class="ask" onclick="openChat()"><span>💬 Ask me anything…</span><b>→</b></div>
  </div>
  <div class="sec">AI CREATIVE TOOLS<i></i></div>
  <div class="grid" id="grid"></div>
  <div class="quick"><div><b>🧰 Quick Tools</b><small>Useful tools for your daily needs.</small></div>
    <button class="q" onclick="soon('Calculator')"><span>🧮</span>Calculator</button><button class="q" onclick="soon('Notes')"><span>📝</span>Notes</button><button class="q" onclick="soon('Files')"><span>📁</span>Files</button><button class="q" onclick="soon('More')"><span>⋯</span>More</button></div>
  <div class="nav"><button class="on"><span>🏠</span>Home</button><button onclick="soon('Tools')"><span>▦</span>Tools</button><button class="mic" onclick="soon('Voice')">🎙️</button><button onclick="soon('History')"><span>🕘</span>History</button><button onclick="soon('Settings')"><span>⚙️</span>Settings</button></div>
</section>

<section class="screen" id="s4">
  <div class="chead"><button onclick="show('s3')">←</button><b>🦅 Chat with Eagle</b></div>
  <div id="chat"></div>
  <div id="prev"></div>
  <div class="cin"><input type="file" id="file" accept="image/*,video/*" multiple hidden><button id="attach" class="at" type="button">📎</button><textarea id="in" rows="1" placeholder="Ask Eagle AI…"></textarea><button id="send">➤</button></div>
</section>
<div class="menu" id="menu"><div class="mbox"><button data-a="copy">📋 Copy</button><button data-a="select">🔤 Select text</button><button data-a="del" class="red">🗑️ Delete</button><button data-a="x">Cancel</button></div></div>
<div class="menu" id="sel"><div class="mbox"><div id="seltxt"></div><button data-a="selx">Close</button></div></div>
<div id="toast"></div>

}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(src){
  const blocks=[];
  const t=esc(src).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{blocks.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return '\u0000'+(blocks.length-1)+'\u0000'});
  const inl=x=>x.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g,'$1<i>$2</i>');
  const out=[];let list=null;const close=()=>{if(list){out.push('</'+list+'>');list=null}};
  for(const line of t.split('\n')){
    let m;
    if(m=line.match(/^\u0000(\d+)\u0000$/)){close();out.push(blocks[m[1]]);continue}
    if(m=line.match(/^\s*#{1,6}\s+(.*)$/)){close();out.push('<h4>'+inl(m[1])+'</h4>');continue}
    if(m=line.match(/^\s*[-*•]\s+(.*)$/)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+inl(m[1])+'</li>');continue}
    if(m=line.match(/^\s*\d+[.)]\s+(.*)$/)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+inl(m[1])+'</li>');continue}
    close();out.push(line.trim()===''?'<div class="sp"></div>':'<p>'+inl(line)+'</p>');
  }
  close();return out.join('').replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]);
}
function typeOut(b,text){return new Promise(res=>{b.classList.add('md');let i=0;const step=Math.max(3,Math.ceil(text.length/90));
  const id=setInterval(()=>{i=Math.min(text.length,i+step);b.innerHTML=md(text.slice(0,i));$('chat').scrollTop=1e9;if(i>=text.length){clearInterval(id);res()}},30)})}
async function send(){
  const typed=$('in').value.trim();if((!typed&&!pend.length)||busy||prepping)return;$('in').value='';
  const atts=pend.splice(0);renderPrev();
  const images=atts.flatMap(x=>x.frames),hasVid=atts.some(x=>x.kind==='video');
  const t=typed||'Please look at this and tell me about it.';
  const content=t+(hasVid?'\n\n(Note: some of these images are frames taken in order from a video I shared.)':'');
  const ub=add('user',typed,atts),uh={role:'user',content,images:images.map(d=>({mime:'image/jpeg',data:d}))};ub._h=uh;ub._raw=typed;hist.push(uh);busy=true;
  const b=add('bot','');b.classList.add('fly');b.innerHTML='<div class="ft"><img class="eg" alt="" src="'+LOGO+'"><i style="top:9px"></i><i style="top:17px;animation-delay:.35s"></i><i style="top:25px;animation-delay:.7s"></i></div>';
  try{let msgs=hist.slice();while(msgs.length&&msgs[0].role!=='user')msgs.shift();
    let bud=12;msgs=msgs.slice().reverse().map(m=>{const im=(m.images||[]).slice(0,bud);bud-=im.length;return{role:m.role,content:m.content,images:im}}).reverse();
    const j=await api('/api/chat',{messages:msgs},true);b.classList.remove('fly');b._raw=j.text;const ah={role:'assistant',content:j.text};b._h=ah;hist.push(ah);await typeOut(b,j.text)}
  catch(e){const i=hist.indexOf(uh);if(i>-1)hist.splice(i,1);b.classList.remove('fly');b.textContent=e.message;if(e.status===401)setTimeout(logout,1200)}
  finally{busy=false}
}

function shrink(src,w,h,max,q){const s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
const b64=u=>u.split(',')[1];
function fromImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{const w=i.naturalWidth,h=i.naturalHeight,full=shrink(i,w,h,1280,.82),th=shrink(i,w,h,200,.7);URL.revokeObjectURL(u);res({kind:'image',thumb:th,frames:[b64(full)]})};
  i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Photo load aagala 😕'))};i.src=u})}
function fromVideo(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
  const fail=m=>{URL.revokeObjectURL(u);rej(new Error(m))},to=setTimeout(()=>fail('Video process aagala. Chinna video try pannunga.'),25000);
  v.onerror=()=>{clearTimeout(to);fail('Video load aagala 😕')};
  v.onloadedmetadata=async()=>{try{const d=isFinite(v.duration)&&v.duration>0?v.duration:1,N=6,frames=[];let thumb='';
    for(let k=0;k<N;k++){v.currentTime=Math.min(d-.05,Math.max(0,(k+.5)/N*d));await new Promise(r=>{v.onseeked=r});
      frames.push(b64(shrink(v,v.videoWidth,v.videoHeight,960,.72)));if(!k)thumb=shrink(v,v.videoWidth,v.videoHeight,200,.7)}
    clearTimeout(to);URL.revokeObjectURL(u);res({kind:'video',thumb,frames})}catch(e){clearTimeout(to);fail('Video process aagala.')}}})}

  prepping=true;toast('Processing… ⏳');
  for(const f of files){if(pend.length>=MAXA){toast('Max '+MAXA+' files mattum');break}
    try{pend.push(f.type.startsWith('video/')?await fromVideo(f):await fromImage(f));renderPrev()}catch(err){toast(err.message)}}
  prepping=false};
$('send').onclick=send;
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
let tgt=null,lpT;
function openMenu(m){if(m.classList.contains('fly'))return;tgt=m;if(navigator.vibrate)navigator.vibrate(15);$('menu').classList.add('on')}
function closeMenus(){$('menu').classList.remove('on');$('sel').classList.remove('on')}
async function copyTxt(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast('Copied ✅')}
$('chat').addEventListener('touchstart',e=>{const m=e.target.closest('.m');if(m)lpT=setTimeout(()=>openMenu(m),480)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>$('chat').addEventListener(ev,()=>clearTimeout(lpT),{passive:true}));
$('chat').addEventListener('contextmenu',e=>{const m=e.target.closest('.m');if(m){e.preventDefault();openMenu(m)}});
document.addEventListener('click',e=>{
  if(e.target.id==='menu'||e.target.id==='sel'){closeMenus();return}
  const a=e.target.dataset&&e.target.dataset.a;if(!a||!tgt)return;
  const txt=tgt.textContent;
  if(a==='copy'){closeMenus();copyTxt(tgt._raw!==undefined?tgt._raw:txt)}
  else if(a==='del'){if(tgt._h){const i=hist.indexOf(tgt._h);if(i>-1)hist.splice(i,1)}tgt.remove();tgt=null;closeMenus();toast('Deleted 🗑️')}
  else if(a==='select'){$('menu').classList.remove('on');const st=$('seltxt');st.textContent=txt;$('sel').classList.add('on');const r=document.createRange();r.selectNodeContents(st);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}
  else closeMenus();
});
if(token&&store.get('eagle_n')){$('uname').textContent=store.get('eagle_n').split(' ')[0];show('s3')}
</script>
