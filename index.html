<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eagle Chat Box</title>
<style>
:root{--bg:#F4EEE2;--surface:#FFFFFF;--ink:#12263A;--muted:#566474;--user-bg:#12263A;--user-ink:#FFF4E0;--gold:#F2B01E;--line:#DDD4C2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1B2A;--surface:#1B3147;--ink:#F4EEE2;--muted:#A9B7C6;--user-bg:#F2B01E;--user-ink:#12263A;--line:#2A425B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1B2A;--surface:#1B3147;--ink:#F4EEE2;--muted:#A9B7C6;--user-bg:#F2B01E;--user-ink:#12263A;--line:#2A425B;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:18px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface)}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.msg.user{align-self:flex-end;background:var(--user-bg);color:var(--user-ink);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.welcome{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
.welcome h2{margin:6px 0 0;font-size:24px}
.welcome p{margin:0;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:12px;width:100%;max-width:340px}
.chip{min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.chip:hover{border-color:var(--gold)}
form{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;min-height:44px;box-sizing:border-box;padding:11px 14px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;line-height:1.35}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--gold);color:#12263A;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5;cursor:default}
[hidden]{display:none !important}
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.login h2{margin:6px 0 0;font-size:26px}
.login p{margin:0;color:var(--muted)}
form.lform{flex-direction:column;align-items:stretch;gap:6px;border-top:0;padding:0;width:100%;max-width:340px;margin-top:12px;text-align:left}
.lform label{font-size:14px;font-weight:600;margin-top:6px}
.lform input{min-height:44px;box-sizing:border-box;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.lform input:focus{outline:2px solid var(--gold);outline-offset:1px}
.lform .err{color:var(--ink);font-weight:600;min-height:18px;font-size:14px}
.cta{min-height:48px;margin-top:8px;border:0;border-radius:14px;background:var(--gold);color:#12263A;font-weight:700;font-size:16px}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:6px 0 0}
.steps li{width:36px;height:6px;border-radius:3px;background:var(--line)}
.steps li.on{background:var(--gold)}
.lform .hint{color:var(--ink);background:var(--surface);border:1px dashed var(--gold);border-radius:12px;padding:8px 12px;font-size:14px}
.lform .hint:empty{display:none}
.link{min-height:44px;border:0;background:none;color:var(--ink);text-decoration:underline;font-size:14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="eagle" viewBox="0 0 300 320">
<defs><clipPath id="ecbc"><circle cx="150" cy="150" r="138"></circle></clipPath></defs>
<path d="M62 244 L30 312 L118 278 Z" fill="#12263A"></path>
<circle cx="150" cy="150" r="144" fill="#12263A"></circle>
<g clip-path="url(#ecbc)">
<path d="M30 320 C40 250 70 200 94 158 L126 160 C150 152 170 140 184 124 C190 150 196 190 230 230 C250 256 262 290 270 320 Z" fill="#5A3E2B"></path>
<path d="M70 250 q14 16 30 6 M104 232 q14 16 30 6 M140 214 q14 16 30 6 M92 286 q14 16 30 6 M150 262 q14 16 30 6 M196 236 q12 14 26 4" stroke="#33231A" stroke-width="4" fill="none" stroke-linecap="round"></path>
<path d="M96 160 C80 130 84 84 116 62 C140 44 176 48 194 72 C198 80 200 86 198 92 L186 118 C176 134 150 150 126 160 Z" fill="#F7F4EC"></path>
<path d="M98 150 L108 184 L122 156 Z M118 156 L132 190 L146 154 Z M142 152 L158 184 L170 144 Z M166 142 L186 168 L190 126 Z" fill="#F7F4EC"></path>
<circle cx="170" cy="97" r="8.5" fill="#FFD23F"></circle>
<circle cx="171" cy="97" r="4.2" fill="#12120F"></circle>
<path d="M150 86 C160 80 178 82 190 92 C178 88 164 88 152 94 Z" fill="#BFAE90"></path>
<path d="M192 76 C214 78 240 96 246 124 C247 136 240 146 230 144 C232 134 226 126 214 124 C200 122 188 124 180 126 C176 112 180 90 192 76 Z" fill="#F2B01E"></path>
<path d="M180 126 C192 124 206 124 216 127" stroke="#6B4308" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
</g>
<circle cx="150" cy="150" r="138" fill="none" stroke="#F2B01E" stroke-width="5"></circle>
</symbol>
</svg>
<div class="app">
<section id="login" class="login" hidden>
<svg width="110" height="117" aria-hidden="true"><use href="#eagle"></use></svg>
<h2>Eagle Chat Box</h2>
<p id="lsub">Step 1 of 3: phone number illa email kudu</p>
<ol class="steps" aria-hidden="true"><li class="on"></li><li></li><li></li></ol>
<form id="s1" class="lform" novalidate>
<label for="lid">Phone number or email</label>
<input id="lid" type="text" autocomplete="username" placeholder="98765 43210 or you@mail.com">
<p class="err" role="alert"></p>
<button class="cta" type="submit">Send OTP</button>
</form>
<form id="s2" class="lform" hidden novalidate>
<label for="lotp">6-digit OTP</label>
<input id="lotp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
<p id="demo" class="hint"></p>
<p class="err" role="alert"></p>
<button class="cta" type="submit">Verify</button>
<button class="link" id="back" type="button">Change number or email</button>
</form>
<form id="s3" class="lform" hidden novalidate>
<label for="lnick">Nice name</label>
<input id="lnick" type="text" maxlength="24" autocomplete="nickname" placeholder="Eg: Machi">
<p class="err" role="alert"></p>
<button class="cta" type="submit">Start chatting</button>
</form>
<p>OTP un phone / email ku varum.</p>
</section>
<header>
<svg width="36" height="38" aria-hidden="true"><use href="#eagle"></use></svg>
<h1>Eagle Chat Box</h1>
<button class="icon-btn" id="new" type="button" aria-label="New chat">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<button class="icon-btn" id="logout" type="button" aria-label="Log out">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
</button>
</header>
<main id="list" aria-live="polite"></main>
<form id="form">
<textarea id="input" rows="1" placeholder="Message Eagle…" aria-label="Message"></textarea>
<button class="send" id="send" type="submit" aria-label="Send">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</form>
</div>
<script>
var KEY = 'ecb:chat', UKEY = 'ecb:user', user = null;
var SYS = 'You are Eagle Chat Box, a friendly, helpful AI assistant. Reply in the same language the person writes in (Tanglish is fine). Keep answers short and clear, and use plain text without markdown.';
var msgs = [];
function loadChat() { msgs = []; try { msgs = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { msgs = []; } }
var busy = false;
var list = document.getElementById('list'), input = document.getElementById('input'), sendBtn = document.getElementById('send');

async function api(url, body, token) {
  var r = await fetch(url, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: JSON.stringify(body) });
  var d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { var err = new Error(d.error || 'Something went wrong. Thirumba try pannu.'); err.status = r.status; throw err; }
  return d;
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(msgs.slice(-40))); } catch (e) {} }
function scroll() { list.scrollTop = list.scrollHeight; }
function bubble(role, text) {
  var d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.textContent = text;
  list.appendChild(d);
  return d;
}
function welcome() {
  var w = document.createElement('div');
  w.className = 'welcome';
  w.innerHTML = '<svg width="110" height="117" aria-hidden="true"><use href="#eagle"></use></svg><h2>Eagle Chat Box</h2><p></p><div class="chips"></div>';
  w.querySelector('p').textContent = (user ? 'Vaa ' + user.name + '! ' : '') + 'Enna venum machi? Kelu!';
  ['Tamil la oru joke sollu', 'Python learn panna plan kudu', 'Oru email draft panna help pannu'].forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t;
    b.addEventListener('click', function () { send(t); });
    w.querySelector('.chips').appendChild(b);
  });
  list.appendChild(w);
}
function render() {
  list.textContent = '';
  if (!msgs.length) { welcome(); return; }
  msgs.forEach(function (m) { bubble(m.role, m.content); });
  scroll();
}
function history() {
  var a = msgs.slice(-20).map(function (m) { return { role: m.role, content: m.content }; });
  while (a.length && a[0].role !== 'user') a.shift();
  return a;
}
async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  msgs.push({ role: 'user', content: text });
  render();
  var out = bubble('bot', '…');
  scroll();
  var reply = '';
  try {
    var r = await api('/api/chat', { messages: history() }, user.token);
    reply = r.text;
  } catch (e) {
    if (e.status === 401) { reply = 'Session expire aaiduchu. Thirumba login pannu.'; setTimeout(function () { document.getElementById('logout').click(); }, 1500); }
    else { reply = e.message || 'Something went wrong. Thirumba try pannu.'; }
  }
  out.textContent = reply;
  msgs.push({ role: 'assistant', content: reply });
  save(); scroll();
  busy = false; sendBtn.disabled = false;
}
document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var t = input.value; input.value = ''; input.style.height = 'auto';
  send(t);
});
input.addEventListener('input', function () { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(hover: hover)').matches) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
});
document.getElementById('new').addEventListener('click', function () { if (busy) return; msgs = []; save(); render(); });
var loginEl = document.getElementById('login');
function showApp(on) {
  loginEl.hidden = on;
  document.querySelector('header').hidden = !on;
  list.hidden = !on;
  document.getElementById('form').hidden = !on;
}
function enter(u) {
  user = u; KEY = 'ecb:chat:' + u.id;
  try { localStorage.setItem(UKEY, JSON.stringify(u)); } catch (e) {}
  loadChat(); showApp(true); render();
}
var steps = ['s1', 's2', 's3'], pend = { id: '', otp: '' };
function go(n) {
  steps.forEach(function (s, i) { document.getElementById(s).hidden = i !== n - 1; });
  document.querySelectorAll('.steps li').forEach(function (li, i) { li.className = i < n ? 'on' : ''; });
  document.getElementById('lsub').textContent = ['Step 1 of 3: phone number illa email kudu', 'Step 2 of 3: OTP type pannu', 'Step 3 of 3: un nice name kudu'][n - 1];
  document.querySelectorAll('.lform .err').forEach(function (p) { p.textContent = ''; });
  var f = document.querySelector('#' + steps[n - 1] + ' input');
  if (f) f.focus();
}
function fail(form, t) { form.querySelector('.err').textContent = t; }
document.getElementById('s1').addEventListener('submit', async function (e) {
  e.preventDefault();
  var v = document.getElementById('lid').value.trim(), id = '';
  if (/^\S+@\S+\.\S+$/.test(v)) { id = v.toLowerCase(); }
  else { var d = v.replace(/[\s\-()]/g, ''); if (/^\+?\d{10,13}$/.test(d)) id = d; }
  if (!id) { fail(this, 'Correct phone number illa email kudu machi.'); return; }
  var btn = this.querySelector('.cta'); btn.disabled = true;
  try {
    var r = await api('/api/otp/send', { id: v });
    pend.id = r.id;
    document.getElementById('demo').textContent = 'OTP anuppitom: ' + r.id;
    document.getElementById('lotp').value = '';
    go(2);
  } catch (er) { fail(this, er.message); }
  btn.disabled = false;
});
document.getElementById('s2').addEventListener('submit', async function (e) {
  e.preventDefault();
  try {
    var r = await api('/api/otp/verify', { id: pend.id, code: document.getElementById('lotp').value.trim() });
    pend.ticket = r.ticket;
    go(3);
  } catch (er) { fail(this, er.message); }
});
document.getElementById('back').addEventListener('click', function () { go(1); });
document.getElementById('s3').addEventListener('submit', async function (e) {
  e.preventDefault();
  var n = document.getElementById('lnick').value.trim();
  if (n.length < 2) { fail(this, 'Nice name kudu machi (2 letters minimum).'); return; }
  try {
    var r = await api('/api/register', { ticket: pend.ticket, name: n });
    enter({ name: r.user.name, id: r.user.id, token: r.token });
  } catch (er) { fail(this, er.message); }
});
document.getElementById('logout').addEventListener('click', function () {
  if (busy) return;
  user = null; msgs = []; KEY = 'ecb:chat'; go(1);
  try { localStorage.removeItem(UKEY); } catch (e) {}
  showApp(false);
});
var saved = null;
try { saved = JSON.parse(localStorage.getItem(UKEY) || 'null'); } catch (e) {}
if (saved && saved.id) { enter(saved); } else { showApp(false); }
</script>
</body>
</html>
