html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.lg{background:var(--logo) center/contain no-repeat;aspect-ratio:836/575;width:100%}
.logo{font-style:italic;font-weight:900;letter-spacing:-1px}
.logo b{font-weight:300}
/* auth */
.auth{overflow-y:auto;padding:24px;align-items:center}
.auth .box{width:100%;max-width:420px;margin:auto 0}
.step{color:var(--mut);font-size:13px;text-align:center;letter-spacing:2px;text-transform:uppercase}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0 18px}
.dots i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.dots i.f{background:var(--ink)}
.hero{text-align:center;font-size:64px;line-height:1}
.auth h2{font-size:30px;margin:6px 0 4px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 18px;font-size:13px;letter-spacing:3px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 14px;outline:none}
input:focus{border-color:var(--ink)}
.btn{width:100%;border:0;border-radius:999px;padding:14px;font-weight:700;margin-top:16px;background:var(--acc);color:var(--accink)}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--ink);margin-top:10px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.alt{text-align:center;color:var(--mut);margin-top:16px}
.alt a{color:var(--ink);text-decoration:underline;cursor:pointer}
/* home */
.scroll{flex:1;overflow-y:auto;padding:14px 14px 20px}
.top{display:flex;align-items:center;gap:10px}
.top .logo{font-size:22px;flex:1}
.pill{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 12px;background:none;font-weight:700;font-size:13px}
.ic{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:none;color:var(--ink);font-size:16px}
.greet{margin:18px 0 12px;position:relative}
.greet small{font-size:20px}
.greet h1{margin:2px 0 4px;font-size:30px;line-height:1.1}
.greet p{margin:0;color:var(--mut);max-width:78%}
.eagle{position:absolute;right:0;top:-6px;font-size:84px;opacity:.9}
.ask{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 6px 6px 16px;margin:14px 0 20px}
.ask input{border:0;background:none;padding:8px 0}
.go{width:38px;height:38px;border-radius:50%;border:0;background:#ccc;color:#000;font-size:18px;flex:none}
h3{font-size:13px;letter-spacing:1.5px;margin:0 0 10px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tool{text-align:left;color:var(--ink);border-radius:18px;padding:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#0b0c10),#0b0c10);border:1px solid color-mix(in srgb,var(--c) 70%,#000);min-height:112px}
.tool .e{font-size:26px;display:block;margin-bottom:6px}
.tool b{display:block;font-size:15px}
.tool span.d{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.quick{margin-top:14px;border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--card)}
.qrow{display:flex;gap:8px;margin-top:10px}
.qrow button{flex:1;background:#0b0c10;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 2px;font-size:11px}
.qrow button span{display:block;font-size:20px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0;font-size:11px}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--ink)}
.mic{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink)!important;margin-top:-14px;background:var(--bg)!important;color:var(--ink)!important;font-size:22px!important;flex:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#000;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
/* chat */
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--ink);color:#000;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.cin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.cin input{border-radius:999px}
textarea,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px;outline:none}
.p{flex:1;overflow-y:auto;padding:14px}
.p>*+*{margin-top:10px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-align:left;width:100%}
.list{display:flex;flex-direction:column;gap:8px}
.mut{color:var(--mut);font-size:13px}
.out{white-space:pre-wrap}
.disp{background:var(--card);border-radius:14px;padding:18px;font-size:34px;text-align:right;min-height:80px;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:16px 0;font-size:20px}
</style>
</head>
<body>

<!-- STEP 1: SIGN UP -->
<section class="view auth on" id="signup"><div class="box">
  <div class="step">Step 1 of 3 · Sign Up</div>
  <div class="dots"><i class="f"></i><i></i><i></i></div>
  <div class="lg" role="img" aria-label="Eagle AI - Chat with you" style="max-width:300px;margin:0 auto 14px"></div>
  <label>Name</label><input id="sn" autocomplete="name">
  <label>Email</label><input id="se" type="email" autocomplete="email">
  <label>Password (min 6)</label><input id="sp" type="password" autocomplete="new-password">
  <div class="err" id="serr"></div>
  <button class="btn" id="sbtn">Sign Up</button>
  <button class="btn o" id="sguest">Sign As Guest</button>
  <div class="alt">Already registered? <a id="tologin">Log in here</a></div>
</div></section>

<!-- STEP 2: LOGIN -->
<section class="view auth" id="login"><div class="box">
  <div class="step">Step 2 of 3 · Login</div>
  <div class="dots"><i class="f"></i><i class="f"></i><i></i></div>
  <div class="lg" role="img" aria-label="Eagle AI" style="max-width:200px;margin:0 auto"></div>
  <h2>Welcome back</h2>
  <p class="sub">LOGIN TO CONTINUE</p>
  <label>Email</label><input id="le" type="email" autocomplete="email">
  <label>Password</label><input id="lp" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="btn" id="lbtn">Login</button>
  <div class="alt">New here? <a id="tosignup">Sign up</a></div>
</div></section>

<!-- STEP 3: HOME -->
<section class="view" id="home">
  <div class="scroll">
    <div class="top">
      <div style="flex:1"><div class="lg" role="img" aria-label="Eagle AI" style="width:96px"></div></div>
      <button class="pill" data-soon="Pro">👑 Pro</button>
      <button class="ic" data-soon="Notifications">🔔</button>
      <button class="ic" id="prof">👤</button>
    </div>
    <div class="greet">
      <div class="eagle lg" style="width:120px;top:0;opacity:.9"></div>
      <small>Hey <span id="uname">there</span>! 👋</small>
      <h1>Welcome to<br><span class="logo">EAGLE <b>AI</b></span></h1>
      <p>Your smart AI assistant &amp; creative partner</p>
    </div>
    <div class="ask"><span>💬</span><input id="hq" placeholder="Ask me anything..."><button class="go" id="hgo">→</button></div>
    <h3>AI CREATIVE TOOLS</h3>
    <div class="grid" id="tools"></div>
    <div class="quick"><b>Quick Tools</b> <span style="color:var(--mut);font-size:12px">· daily needs</span>
      <div class="qrow">
        <button data-soon="Calculator"><span>🧮</span>Calculator</button>
        <button data-soon="Notes"><span>📝</span>Notes</button>
        <button data-soon="Files"><span>📁</span>Files</button>
        <button data-soon="Cloud"><span>☁️</span>Cloud</button>
        <button data-soon="More"><span>⋯</span>More</button>
      </div>
    </div>
  </div>
  <nav class="nav">
    <button class="on"><span>🏠</span>Home</button>
    <button data-soon="Tools"><span>▦</span>Tools</button>
    <button class="mic" data-soon="Voice">🎙</button>
    <button data-soon="History"><span>🕘</span>History</button>
    <button id="logout"><span>⚙️</span>Logout</button>
  </nav>
</section>

<!-- CHAT -->
<section class="view" id="chat">
  <div class="chead"><button class="ic" id="back">←</button><b>Chat with Eagle</b></div>
  <div id="log"></div>
  <div class="cin"><input id="ci" placeholder="Eagle kitta kelu..."><button class="go" id="csend">➤</button></div>
</section>

<section class="view" id="panel">
  <div class="chead"><button class="ic" id="pback">←</button><b id="ptitle"></b></div>
  <div class="p" id="pbody"></div>
</section>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const TOOLS=[
 ['💬','Chat with Eagle','Ask anything, get smart answers','#10b981','chat'],
 ['🌐','Website Creator','Build a website, no coding','#3b82f6'],
 ['🎵','Song Player','Play your favourite songs','#ec4899'],
 ['🖼️','AI Photo Editor','Edit and enhance photos','#f59e0b'],
 ['🎬','Video Editor','Trim, cut, add effects','#a855f7'],
 ['▶️','AI Video Generator','Turn ideas into videos','#06b6d4'],
 ['🎨','AI Photo Generator','Create images from text','#e11d8f'],
 ['📱','Phone Doctor','Check phone health','#14b8a6'],
 ['🔗','Share Tool','Share files, links, text','#6366f1']
];
let user=null, db=null;
try{db=window.localStorage}catch(e){}
const mem={};
const get=k=>{try{return db?db.getItem(k):mem[k]}catch(e){return mem[k]}};
const set=(k,v)=>{try{db?db.setItem(k,v):mem[k]=v}catch(e){mem[k]=v}};
const del=k=>{try{db?db.removeItem(k):delete mem[k]}catch(e){delete mem[k]}};
const users=()=>{try{return JSON.parse(get('eagle_users')||'{}')}catch(e){return{}}};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id))}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1600)}
document.addEventListener('click',e=>{const s=e.target.closest('[data-soon]');if(s)openTool(s.dataset.soon)});

function enter(u){user=u;$('uname').textContent=u.name.split(' ')[0];set('eagle_session',u.email);show('home')}

$('tologin').onclick=()=>{$('serr').textContent='';show('login')};
$('tosignup').onclick=()=>{$('lerr').textContent='';show('signup')};
$('sbtn').onclick=async()=>{
  const n=$('sn').value.trim(),e=$('se').value.trim().toLowerCase(),p=$('sp').value;
  if(!n||!/^\S+@\S+\.\S+$/.test(e))return $('serr').textContent='Name & valid email kudu machi.';
  if(p.length<6)return $('serr').textContent='Password minimum 6 characters.';
  const all=users();
  if(all[e])return $('serr').textContent='Email already registered. Login pannu.';
  all[e]={name:n,email:e,pw:await hash(p)};set('eagle_users',JSON.stringify(all));
  $('serr').textContent='';$('le').value=e;$('lp').value='';
  show('login');toast('Account created ✅ Ippo login pannu');
};
$('sguest').onclick=()=>enter({name:'Guest',email:'guest'});
$('lbtn').onclick=async()=>{
  const e=$('le').value.trim().toLowerCase(),p=$('lp').value,u=users()[e];
  if(!u||u.pw!==await hash(p))return $('lerr').textContent='Email illa password thappu machi.';
  $('lerr').textContent='';enter(u);
};
$('logout').onclick=()=>{del('eagle_session');user=null;$('sp').value='';$('lp').value='';show('login');toast('Logged out')};
$('prof').onclick=()=>toast(user&&user.email!=='guest'?user.email:'Guest mode');

// tools grid
TOOLS.forEach(t=>{
  const b=document.createElement('button');b.className='tool';b.style.setProperty('--c',t[3]);
  b.innerHTML='<span class="e">'+t[0]+'</span><b></b><span class="d"></span>';
  b.querySelector('b').textContent=t[1];b.querySelector('.d').textContent=t[2];
  if(t[4]==='chat')b.onclick=()=>openChat();else b.dataset.soon=t[1];
  $('tools').appendChild(b);
});

// chat
const SYS="You are Eagle AI, a friendly, sharp assistant. Reply in the user's language. If they write Tanglish (Tamil in English letters), reply in casual Tanglish with a warm 'machi' vibe. Keep answers short.";
let hist=[],sample=null,busy=false;
(async()=>{try{sample=await claude.use('sample')}catch(e){sample=null}})();
function add(r,t){const d=document.createElement('div');d.className='m '+(r==='user'?'u':'a');d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9;return d}
function openChat(q){show('chat');if(!hist.length&&!$('log').children.length)add('ai','Vanakkam machi! Naan Eagle AI 🦅 Ethu venalum kelu.');if(q)ask(q)}
async function ask(text){
  text=(text||$('ci').value).trim();if(!text||busy)return;
  if(!sample)return add('ai','AI connect aagala. Claude app-la open pannu machi.');
  $('ci').value='';hist.push({role:'user',content:text});add('user',text);
  const b=add('ai','…');busy=true;
  const msgs=hist.map((m,i)=>i===0?{role:'user',content:SYS+"\n\nUser: "+m.content}:m);
  try{const r=await sample(msgs,{cache:false,onText:({text})=>{b.textContent=text;$('log').scrollTop=1e9}});b.textContent=r.text;hist.push({role:'assistant',content:r.text})}
  catch(e){b.textContent=e&&e.code==='not_granted'?'Permission kudu machi.':'Etho problem aachu, marubadi try pannu.';hist.pop()}
  busy=false;
}
$('csend').onclick=()=>ask();
$('ci').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
$('back').onclick=()=>show('home');
$('hgo').onclick=()=>{const q=$('hq').value.trim();$('hq').value='';openChat(q||undefined)};
$('hq').addEventListener('keydown',e=>{if(e.key==='Enter')$('hgo').click()});

// ---- tools ----
const fence=t=>t.replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim();
async function gen(p){if(!sample)throw 0;return (await sample(p,{cache:false})).text}
function genTool(b,{ph,btn,run}){
 b.innerHTML='<textarea rows="3" placeholder="'+ph+'"></textarea><button class="btn">'+btn+'</button><div class="out"></div>';
 const t=b.querySelector('textarea'),o=b.querySelector('.out'),g=b.querySelector('.btn');
 g.onclick=async()=>{const q=t.value.trim();if(!q)return;g.disabled=true;o.textContent='Eagle yosikkudhu…';
  try{await run(q,o)}catch(e){o.textContent=sample?'Problem aachu, marubadi try pannu.':'AI connect aagala. Claude app-la open pannu.'}g.disabled=false}}
function calc(s){let i=0;const ws=()=>{while(s[i]===' ')i++};
 const num=()=>{ws();if(s[i]==='('){i++;const v=add();ws();i++;return v}if(s[i]==='-'){i++;return -num()}const m=s.slice(i).match(/^\d*\.?\d+/);if(!m)throw 0;i+=m[0].length;return +m[0]};
 const mul=()=>{let v=num();for(;;){ws();const c=s[i];if(c==='*'){i++;v*=num()}else if(c==='/'){i++;v/=num()}else return v}};
 const add=()=>{let v=mul();for(;;){ws();const c=s[i];if(c==='+'){i++;v+=mul()}else if(c==='-'){i++;v-=mul()}else return v}};
 const r=add();ws();if(i<s.length)throw 0;return r}
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const T={};
T['Calculator']=b=>{b.innerHTML='<div class="disp">0</div><div class="ck"></div>';let ex='';const d=b.firstChild,k=b.lastChild;
 ['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','⌫','='].forEach(c=>{const x=mk('button','',c);x.onclick=()=>{
  if(c==='C')ex='';else if(c==='⌫')ex=ex.slice(0,-1);else if(c==='='){try{ex=String(+calc(ex).toFixed(10))}catch(e){ex='Error'}}else{if(ex==='Error')ex='';ex+=c}
  d.textContent=ex||'0'};k.appendChild(x)})};
T['Notes']=b=>{const L=()=>{try{return JSON.parse(get('eagle_notes')||'[]')}catch(e){return[]}};
 b.innerHTML='<textarea rows="3" placeholder="Note ezhudhu..."></textarea><button class="btn">Add note</button><div class="list"></div>';
 const t=b.querySelector('textarea'),ls=b.querySelector('.list');
 const draw=()=>{ls.innerHTML='';L().forEach((n,i)=>{const r=mk('div','it');const x=mk('button','ic','✕');x.onclick=()=>{const a=L();a.splice(i,1);set('eagle_notes',JSON.stringify(a));draw()};r.append(mk('span','',n),x);ls.appendChild(r)})};
 b.querySelector('.btn').onclick=()=>{const v=t.value.trim();if(!v)return;const a=L();a.unshift(v);set('eagle_notes',JSON.stringify(a));t.value='';draw()};draw()};
T['Files']=b=>{b.innerHTML='<input type="file" multiple><p class="mut">Select pannina files mattum kaattum (device-ku veliya save aagadhu).</p><div class="list"></div>';const l=b.lastChild;
 b.firstChild.onchange=e=>{l.innerHTML='';[...e.target.files].forEach(f=>{const d=mk('div','it');d.append(mk('span','',f.name),mk('b','',(f.size/1024).toFixed(0)+' KB'));l.appendChild(d)})}};
T['Cloud']=b=>{let n=0;try{n=JSON.parse(get('eagle_notes')||'[]').length}catch(e){}
 b.innerHTML='<div class="it"><span>Notes saved</span><b>'+n+'</b></div><div class="it"><span>Accounts on device</span><b>'+Object.keys(users()).length+'</b></div><button class="btn">Copy notes backup</button><p class="mut">Real cloud sync-ku server venum. Ippo indha device-la mattum save aagum.</p>';
 b.querySelector('.btn').onclick=async()=>{try{await navigator.clipboard.writeText(get('eagle_notes')||'[]');toast('Backup copied ✅')}catch(e){toast('Copy aagala')}}};
T['More']=b=>{const l=mk('div','list');b.appendChild(l);['Notes','Calculator','Files','Cloud','Notifications','Pro'].concat(TOOLS.slice(1).map(t=>t[1])).forEach(n=>{const x=mk('button','it',n);x.onclick=()=>openTool(n);l.appendChild(x)})};
T['Notifications']=b=>{b.innerHTML='<div class="it"><span>🦅 Welcome to Eagle AI! Tools ellam try pannu.</span></div>'};
T['Pro']=b=>{b.innerHTML='<div class="it"><span>👑 Eagle Pro</span></div><p class="mut">Ippo ellam free machi. Pro plan seekiram varum.</p>'};
T['History']=b=>{const l=mk('div','list');b.appendChild(l);const u=hist.filter(m=>m.role==='user');if(!u.length)l.textContent='Innum chat illa machi.';u.forEach(m=>{const x=mk('button','it',m.content);x.onclick=()=>openChat();l.appendChild(x)})};
T['Phone Doctor']=async b=>{const n=navigator,rows=[];
 try{const bt=await n.getBattery();rows.push(['🔋 Battery',Math.round(bt.level*100)+'%'+(bt.charging?' (charging)':'')])}catch(e){rows.push(['🔋 Battery','Not available'])}
 try{const s=await n.storage.estimate();rows.push(['💾 Browser storage',(s.usage/1048576).toFixed(1)+' MB / '+(s.quota/1073741824).toFixed(1)+' GB'])}catch(e){rows.push(['💾 Storage','Not available'])}
 const c=n.connection;rows.push(['📶 Data',c?c.effectiveType+', ~'+c.downlink+' Mbps':(n.onLine?'Online':'Offline')]);
 rows.push(['🧠 RAM',n.deviceMemory?n.deviceMemory+' GB':'Unknown'],['⚙️ CPU cores',n.hardwareConcurrency||'Unknown'],['📐 Screen',screen.width+'×'+screen.height],['🌡️ Temp','Browser-la theriyadhu']);
 rows.forEach(r=>{const d=mk('div','it');d.append(mk('span','',r[0]),mk('b','',r[1]));b.appendChild(d)})};
T['Share Tool']=b=>{b.innerHTML='<textarea rows="4" placeholder="Share panna text / link..."></textarea><button class="btn">Share</button>';
 b.querySelector('.btn').onclick=async()=>{const v=b.querySelector('textarea').value.trim();if(!v)return;
  try{if(navigator.share){await navigator.share({text:v});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(v);toast('Copied ✅ Ippo paste pannu')}catch(e){toast('Share aagala')}}};
T['Song Player']=b=>{b.innerHTML='<input type="file" accept="audio/*" multiple><div class="mut">Songs select pannu machi 🎵</div><audio controls style="width:100%"></audio><div class="list"></div>';

 Object.keys(F).forEach(k=>{v[k]=F[k][0];const r=mk('input');r.type='range';r.min=F[k][1];r.max=F[k][2];r.value=v[k];r.oninput=()=>{v[k]=r.value;draw()};sl.append(mk('label','',k),r)});
 b.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{img=im;draw()};im.src=URL.createObjectURL(f)};

 g('vf').onchange=()=>{v.style.filter=g('vf').value};g('vp').oninput=()=>{v.playbackRate=+g('vp').value};
 v.ontimeupdate=()=>{const e=+g('ve').value;if(e>0&&v.currentTime>=e)v.pause()};

<script>
// ---- server mode: Firebase auth + Claude via your own backend ----
let tok=get('eagle_token');
async function api(p,b,useTok){
  const r=await fetch('/api/'+p,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},useTok&&tok?{Authorization:'Bearer '+tok}:{}),body:JSON.stringify(b||{})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&useTok){del('eagle_token');tok=null;show('login')}
  if(!r.ok)throw new Error(j.error||'Server problem aachu.');
  return j}
const sess=r=>{tok=r.token;set('eagle_token',tok);enter(r.user)};
const busyBtn=async(btn,errEl,fn)=>{btn.disabled=true;errEl.textContent='';try{await fn()}catch(e){errEl.textContent=e.message}btn.disabled=false};
$('sbtn').onclick=()=>busyBtn($('sbtn'),$('serr'),async()=>{
  const name=$('sn').value.trim(),email=$('se').value.trim(),password=$('sp').value;
  if(!name||!/^\S+@\S+\.\S+$/.test(email))throw new Error('Name & valid email kudu machi.');
  if(password.length<6)throw new Error('Password minimum 6 characters.');
  sess(await api('signup',{name,email,password}))});
$('lbtn').onclick=()=>busyBtn($('lbtn'),$('lerr'),async()=>sess(await api('login',{email:$('le').value,password:$('lp').value})));
$('sguest').onclick=()=>busyBtn($('sguest'),$('serr'),async()=>sess(await api('guest')));
$('logout').onclick=()=>{del('eagle_token');tok=null;user=null;hist=[];$('log').innerHTML='';$('sp').value='';$('lp').value='';show('login');toast('Logged out')};
sample=true;
async function chatAPI(messages,max,raw){return (await api('chat',{messages,max_tokens:max,raw},true)).text}
async function gen(p){return chatAPI([{role:'user',content:p}],4096,true)}
async function ask(text){
  text=(text||$('ci').value).trim();if(!text||busy)return;
  $('ci').value='';hist.push({role:'user',content:text});add('user',text);
  const b=add('ai','…');busy=true;
  try{const t=await chatAPI(hist,1024);b.textContent=t;hist.push({role:'assistant',content:t})}
  catch(e){b.textContent=e.message;hist.pop()}
  busy=false}
(async()=>{if(!tok)return;try{const p=JSON.parse(atob(tok.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));if(p.exp>Date.now())enter({name:p.name,email:p.email});else{del('eagle_token');tok=null}}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

<script>
// ---- Song Player v2: phone library (saved) + online search ----
(function(){
const st=document.createElement('style');
st.textContent='.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mut)}.tabs button.on{background:var(--ink);color:#000}.np{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.np img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#000}.np div{min-width:0}.np b,.np small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np small{color:var(--mut)}.ctl{display:flex;justify-content:space-around}.ctl button{background:none;border:0;color:var(--ink);font-size:24px;padding:6px 10px}.ctl button.on{color:var(--gold)}.srow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);text-align:left;width:100%}.srow img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}.srow span{flex:1;min-width:0}.srow span b,.srow span small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srow small{color:var(--mut)}.srow a{color:var(--mut);text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;flex:none}.srow.cur{border-color:var(--gold)}.addb{display:block;text-align:center;border:1.5px solid var(--ink);border-radius:999px;padding:12px;font-weight:700;cursor:pointer}';
document.head.appendChild(st);

const AU=new Audio();let Q=[],QI=0,shuf=false,rep=false,lastUrl=null,UI=null;
const IDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('eagle',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,fn)=>{const d=await IDB();return new Promise((res,rej)=>{const t=d.transaction('songs',mode),o=t.objectStore('songs'),q=fn(o);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const dbAll=()=>tx('readonly',o=>o.getAll());
const dbPut=r=>tx('readwrite',o=>o.put(r));
const dbDel=id=>tx('readwrite',o=>o.delete(id));

function paint(){
  if(!UI)return;const t=Q[QI];
  UI.t.textContent=t?t.title:'Song select pannu 🎵';UI.a.textContent=t?(t.artist||''):'';
  if(t&&t.art){UI.i.src=t.art;UI.i.style.visibility='visible'}else UI.i.style.visibility='hidden';
  UI.p.textContent=AU.paused?'▶':'⏸';UI.s.classList.toggle('on',shuf);UI.r.classList.toggle('on',rep);
  UI.l.querySelectorAll('.srow').forEach(r=>r.classList.toggle('cur',+r.dataset.k===QI&&r.dataset.q===String(Q.__id)));
}
function playQ(list,i){
  Q=list;QI=i;const t=Q[QI];
  if(lastUrl){URL.revokeObjectURL(lastUrl);lastUrl=null}
  if(t.url)AU.src=t.url;else{lastUrl=URL.createObjectURL(t.blob);AU.src=lastUrl}
  AU.play().catch(()=>toast('Play aagala'));
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',artwork:t.art?[{src:t.art}]:[]});
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1))}catch(e){}}
  paint();
}
function step(d){if(!Q.length)return;const n=shuf&&Q.length>1?Math.floor(Math.random()*Q.length):(QI+d+Q.length)%Q.length;playQ(Q,n)}
AU.onended=()=>{if(rep){AU.currentTime=0;AU.play()}else step(1)};
AU.onplay=AU.onpause=paint;
AU.onerror=()=>toast('Intha song play aagala');

T['Song Player']=b=>{
  b.innerHTML='<div class="tabs"><button class="on" data-t="my">📱 My Songs</button><button data-t="on">🌐 Online</button></div>'+
  '<div class="np"><img alt=""><div><b></b><small></small></div></div>'+
  '<input type="range" min="0" max="100" value="0" step="0.1">'+
  '<div class="ctl"><button class="s">🔀</button><button class="pv">⏮</button><button class="p">▶</button><button class="nx">⏭</button><button class="r">🔁</button></div>'+
  '<div class="pane"></div><div class="list sl2"></div>';
  const q=s=>b.querySelector(s),pane=q('.pane'),l=q('.sl2'),seek=q('input[type=range]');
  UI={t:q('.np b'),a:q('.np small'),i:q('.np img'),p:q('.p'),s:q('.s'),r:q('.r'),l:l};
  q('.s').onclick=()=>{shuf=!shuf;paint()};q('.r').onclick=()=>{rep=!rep;paint()};
  q('.pv').onclick=()=>step(-1);q('.nx').onclick=()=>step(1);
  q('.p').onclick=()=>{if(!Q.length)return;AU.paused?AU.play():AU.pause()};
  AU.ontimeupdate=()=>{if(AU.duration)seek.value=AU.currentTime/AU.duration*100};
  seek.oninput=()=>{if(AU.duration)AU.currentTime=seek.value/100*AU.duration};
  const row=(t,k,tag,extra)=>{const x=mk('div','srow');x.dataset.k=k;x.dataset.q=tag;x.style.cursor='pointer';
    if(t.art){const im=mk('img');im.src=t.art;im.alt='';x.appendChild(im)}
    const s=mk('span');s.append(mk('b','',t.title),mk('small','',t.artist||''));x.appendChild(s);if(extra)x.appendChild(extra);return x};

  let tab='my',mine=[];
  async function showMine(filter){
    l.innerHTML='';
    try{mine=(await dbAll()).map(r=>({id:r.id,title:r.name,artist:'My phone',blob:r.blob}))}catch(e){mine=[];l.textContent='Songs save panna mudiyala (storage).'}
    const f=(filter||'').toLowerCase();const list=mine.filter(t=>t.title.toLowerCase().includes(f));list.__id='my';
    if(!mine.length)l.appendChild(mk('p','mut','Innum songs illa. "Add songs" click panni phone-la irundhu select pannu. Music folder-la Select all pannina ellam sethukkum, appuram app-la save aagidum.'));
    list.forEach((t,k)=>{const d=mk('button','ic','✕');d.onclick=async e=>{e.stopPropagation();await dbDel(t.id);showMine(q('#flt')&&q('#flt').value)};
      const r=row(t,k,'my',d);r.onclick=()=>playQ(list,k);l.appendChild(r)});
    paint();
  }
  function mineUI(){
    pane.innerHTML='<label class="addb">➕ Add songs<input type="file" accept="audio/*" multiple hidden></label><input id="flt" placeholder="Search my songs...">';
    pane.querySelector('input[type=file]').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;toast('Saving '+fs.length+' songs…');
      try{for(const f of fs)await dbPut({name:f.name.replace(/\.[^.]+$/,''),size:f.size,blob:f})}catch(er){toast('Storage full machi')}
      e.target.value='';showMine()};
    pane.querySelector('#flt').oninput=e=>showMine(e.target.value);
    showMine();
  }
  function onlineUI(){
    pane.innerHTML='<div style="display:flex;gap:8px"><input id="oq" placeholder="Song / artist / movie..."><button class="go" style="width:48px;height:auto;border-radius:12px">🔍</button></div><p class="mut">Online-la 30 sec preview mattum play aagum (licensing). Full song-ku "YouTube" button click pannu.</p>';
    l.innerHTML='';
    const run=async()=>{const term=pane.querySelector('#oq').value.trim();if(!term)return;l.textContent='Thedikkittu irukken…';
      try{const r=await fetch('https://itunes.apple.com/search?'+new URLSearchParams({term,media:'music',entity:'song',limit:40,country:'IN'}));const j=await r.json();
        const list=j.results.filter(x=>x.previewUrl).map(x=>({title:x.trackName,artist:x.artistName,art:x.artworkUrl100,url:x.previewUrl}));list.__id='on';
        l.innerHTML='';if(!list.length)l.textContent='Onnum kidaikala machi.';
        list.forEach((t,k)=>{const y=mk('a','','▶ YouTube');y.href='https://www.youtube.com/results?search_query='+encodeURIComponent(t.title+' '+t.artist);y.target='_blank';y.rel='noopener';y.onclick=e=>e.stopPropagation();
          const r=row(t,k,'on',y);r.onclick=()=>playQ(list,k);l.appendChild(r)});paint();
      }catch(e){l.textContent='Search aagala. Internet check pannu.'}};
    pane.querySelector('.go').onclick=run;pane.querySelector('#oq').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
  }
  b.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;b.querySelectorAll('.tabs button').forEach(y=>y.classList.toggle('on',y===x));tab==='my'?mineUI():onlineUI()});
  mineUI();paint();
};
})();
</script>
