<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Eagle AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0A47A8;--ink:#000;--muted:#555;--soft:#F1F4FA;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff;color:var(--ink);font-family:'Poppins',-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
[hidden]{display:none !important}
button{font:inherit;cursor:pointer}
.screen{min-height:100%;max-width:480px;margin:0 auto;position:relative;display:flex;flex-direction:column;padding-bottom:40px}
.center{align-items:center}
.logo{width:min(70%,300px);height:auto;margin-top:22vh}
.bottom{margin-top:auto;width:100%;padding:0 32px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bottom h1{margin:0;font-size:36px;font-weight:700}
.sub{margin:-8px 0 6px;font-size:15px}
.pill{width:100%;max-width:340px;height:68px;border-radius:34px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:14px;border:2px solid #000}
.pill.black{background:#000;color:#fff;padding:0 10px}
.pill.black .ico{width:48px;height:48px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}
.pill.black span:last-child{flex:1;text-align:center;padding-right:48px}
.pill.outline{background:#fff;color:#000;height:52px;justify-content:center;letter-spacing:.06em;max-width:300px}
.blobwrap{position:relative;width:min(66%,290px);line-height:0}
.blobwrap svg{width:100%;height:auto}
.blobwrap h2{position:absolute;left:23%;top:38%;margin:0;color:#fff;font-size:40px;font-weight:700;line-height:1.1}
form.auth{padding:0 36px;margin-top:56px}
.field{position:relative;margin-top:30px}
.field label{position:absolute;top:-13px;left:28px;background:#fff;padding:0 12px;font-size:16px;letter-spacing:.1em}
.field input{width:100%;height:60px;border:1.5px solid var(--blue);border-radius:12px;padding:0 54px 0 22px;font:inherit;font-size:16px;background:#fff;color:#000}
.field input:focus{outline:3px solid #8DB4F2;outline-offset:1px}
.eye{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;color:var(--blue);display:grid;place-items:center}
.btn{width:100%;height:62px;margin-top:28px;border:0;border-radius:12px;background:#000;color:#fff;font-size:20px}
.btn:disabled{opacity:.55}
.alt{text-align:center;font-size:14px;margin:18px 0 0}
.linkbtn{border:0;background:none;color:#000;text-decoration:underline;padding:8px;font-size:14px;min-height:44px}
.err{color:#B3261E;font-size:14px;min-height:20px;margin:10px 0 0;text-align:center}
.chatwrap{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
.chatwrap header{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid #E3E8F2}
.chatwrap header img{height:40px;width:auto;margin-right:auto}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:none;color:#000;display:grid;place-items:center}
.ib:hover{background:var(--soft)}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.msg.user{align-self:flex-end;background:#000;color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--soft);border:1px solid #E3E8F2;border-bottom-left-radius:6px}
.welcome{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;width:100%}
.welcome h2{margin:0;font-size:24px}
.welcome p{margin:0;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:14px;width:100%;max-width:340px}
.chip{min-height:46px;padding:10px 14px;border:1.5px solid var(--blue);border-radius:14px;background:#fff;text-align:left;color:#000}
#cform{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #E3E8F2}
#cform textarea{flex:1;resize:none;max-height:140px;min-height:46px;padding:11px 16px;border:1.5px solid var(--blue);border-radius:23px;font:inherit;font-size:16px;line-height:1.35;color:#000;background:#fff}
#cform textarea:focus{outline:3px solid #8DB4F2;outline-offset:1px}
.send{width:46px;height:46px;border:0;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5}
</style>
</head>

</header>
<div id="list" aria-live="polite"></div>
<form id="cform"><textarea id="input" rows="1" placeholder="Message Eagle AI…" aria-label="Message"></textarea><button class="send" id="send" type="submit" aria-label="Send"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></form>

<script>
var AK = 'ecb:auth2', auth = null, cfg = { key: '' }, msgs = [], busy = false, KEY = '';
function $(i) { return document.getElementById(i); }
function show(id) { ['welcome', 'loginScr', 'signupScr', 'chat'].forEach(function (s) { $(s).hidden = (s !== id); }); window.scrollTo(0, 0); }
function saveAuth() { try { localStorage.setItem(AK, JSON.stringify(auth)); } catch (e) {} }
var ERR = {
  EMAIL_EXISTS: 'Indha email already irukku. Login pannu.',
  EMAIL_NOT_FOUND: 'Email illa password thappu.',
  INVALID_PASSWORD: 'Email illa password thappu.',
  INVALID_LOGIN_CREDENTIALS: 'Email illa password thappu.',
  INVALID_EMAIL: 'Correct email kudu.',
  WEAK_PASSWORD: 'Password kuraivu 6 letters venum.',
  MISSING_PASSWORD: 'Password kudu.',
  TOO_MANY_ATTEMPTS: 'Nerama try pannitta. Konjam neram kalichu vaa.',
  OPERATION_NOT_ALLOWED: 'Firebase la indha sign-in method enable pannala.',
  ADMIN_ONLY_OPERATION: 'Firebase la Anonymous (Guest) enable pannala.',
  'API key not valid': 'Firebase API key thappu. Render Environment check pannu.'
};
function friendly(m) { m = String(m || ''); for (var k in ERR) { if (m.indexOf(k) > -1) return ERR[k]; } return 'Something went wrong. Thirumba try pannu.'; }
async function fb(path, body) {
  if (!cfg.key) throw new Error('Server setup pending (FIREBASE_API_KEY).');
  var r = await fetch('https://identitytoolkit.googleapis.com/v1/' + path + '?key=' + cfg.key, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  var d = await r.json();
  if (!r.ok) throw new Error(friendly(d.error && d.error.message));
  return d;
}
async function refresh() {
  var r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + cfg.key, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(auth.refreshToken) });
  var d = await r.json();
  if (!r.ok) throw new Error('expired');
  auth.idToken = d.id_token; auth.refreshToken = d.refresh_token; saveAuth();
}
function setErr(el, t) { el.textContent = t; }
async function run(form, errEl, fn) {
  var b = form.querySelector('button[type=submit]') || form; if (b.disabled !== undefined) b.disabled = true;
  setErr(errEl, '');
  try { await fn(); } catch (e) { setErr(errEl, e.message || 'Something went wrong.'); }
  if (b.disabled !== undefined) b.disabled = false;
}
function enter(a) {
  auth = a; saveAuth(); KEY = 'ecb:chat:' + a.uid;
  try { msgs = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { msgs = []; }
  show('chat'); render();
}
function logout() { auth = null; try { localStorage.removeItem(AK); } catch (e) {} msgs = []; show('welcome'); }

document.querySelectorAll('.eye').forEach(function (b) {
  b.addEventListener('click', function () {
    var i = $(b.getAttribute('data-for')); var t = i.type === 'password';
    i.type = t ? 'text' : 'password'; b.setAttribute('aria-label', t ? 'Hide password' : 'Show password');
  });
});
$('toSignup').addEventListener('click', function () { show('signupScr'); });
$('toSignup2').addEventListener('click', function () { show('signupScr'); });
$('toLogin').addEventListener('click', function () { show('loginScr'); });
$('guest').addEventListener('click', function () {
  var b = this; b.disabled = true; setErr($('werr'), '');
  fb('accounts:signUp', { returnSecureToken: true }).then(function (d) {
    enter({ idToken: d.idToken, refreshToken: d.refreshToken, uid: d.localId, name: 'Guest', guest: true });
  }).catch(function (e) { setErr($('werr'), e.message); }).then(function () { b.disabled = false; });
});
$('signupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = this, err = f.querySelector('.err');
  var n = $('sn').value.trim(), m = $('se').value.trim(), p = $('sp').value;
  if (n.length < 2) { setErr(err, 'Name kudu (2 letters minimum).'); return; }
  run(f, err, async function () {
    var d = await fb('accounts:signUp', { email: m, password: p, returnSecureToken: true });
    var u = await fb('accounts:update', { idToken: d.idToken, displayName: n, returnSecureToken: true });
    enter({ idToken: u.idToken || d.idToken, refreshToken: u.refreshToken || d.refreshToken, uid: d.localId, name: n, email: m });
  });
});
$('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = this, err = f.querySelector('.err');
  run(f, err, async function () {
    var d = await fb('accounts:signInWithPassword', { email: $('le').value.trim(), password: $('lp').value, returnSecureToken: true });
    enter({ idToken: d.idToken, refreshToken: d.refreshToken, uid: d.localId, name: d.displayName || 'friend', email: d.email });
  });
});

var list = $('list'), input = $('input'), sendBtn = $('send');
function saveChat() { try { localStorage.setItem(KEY, JSON.stringify(msgs.slice(-40))); } catch (e) {} }
function toBottom() { list.scrollTop = list.scrollHeight; }
function bubble(role, text) { var d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'user' : 'bot'); d.textContent = text; list.appendChild(d); return d; }
function welcomeBox() {
  var w = document.createElement('div'); w.className = 'welcome';
  w.innerHTML = '<h2></h2><p>Enna venum machi? Kelu!</p><div class="chips"></div>';
  w.querySelector('h2').textContent = 'Hi, ' + (auth && auth.name || 'friend') + '!';
  ['Tamil la oru joke sollu', 'Python learn panna plan kudu', 'Oru email draft panna help pannu'].forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t;
    b.addEventListener('click', function () { send(t); }); w.querySelector('.chips').appendChild(b);
  });
  list.appendChild(w);
}
function render() { list.textContent = ''; if (!msgs.length) { welcomeBox(); return; } msgs.forEach(function (m) { bubble(m.role, m.content); }); toBottom(); }
function history() {
  var a = msgs.slice(-20).map(function (m) { return { role: m.role, content: m.content }; });
  while (a.length && a[0].role !== 'user') a.shift();
  return a;
}
async function callChat() {
  for (var i = 0; i < 2; i++) {
    var r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + auth.idToken }, body: JSON.stringify({ messages: history() }) });
    var d = {}; try { d = await r.json(); } catch (e) {}
    if (r.status === 401 && i === 0) { try { await refresh(); continue; } catch (e) {} }
    if (r.status === 401) { var er = new Error('Session expire aaiduchu. Thirumba login pannu.'); er.auth = true; throw er; }
    if (!r.ok) throw new Error(d.error || 'Something went wrong. Thirumba try pannu.');
    return d.text;
  }
}
async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  msgs.push({ role: 'user', content: text }); render();
  var out = bubble('bot', '…'); toBottom();
  var reply = '', expired = false;
  try { reply = await callChat(); } catch (e) { reply = e.message || 'Something went wrong. Thirumba try pannu.'; expired = !!e.auth; }
  out.textContent = reply; msgs.push({ role: 'assistant', content: reply }); saveChat(); toBottom();
  busy = false; sendBtn.disabled = false;
  if (expired) setTimeout(logout, 1800);
}
$('cform').addEventListener('submit', function (e) { e.preventDefault(); var t = input.value; input.value = ''; input.style.height = 'auto'; send(t); });
input.addEventListener('input', function () { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(hover: hover)').matches) { e.preventDefault(); $('cform').requestSubmit(); } });
$('newChat').addEventListener('click', function () { if (busy) return; msgs = []; saveChat(); render(); });
$('logout').addEventListener('click', function () { if (!busy) logout(); });

(async function start() {
  try { var r = await fetch('/api/config'); cfg = await r.json(); } catch (e) {}
  var saved = null; try { saved = JSON.parse(localStorage.getItem(AK) || 'null'); } catch (e) {}
  if (saved && saved.uid && saved.idToken) { enter(saved); } else { show('welcome'); }
})();
</script>
